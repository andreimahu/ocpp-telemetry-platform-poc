server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS keeps service names valid when containers are recreated.
    resolver 127.0.0.11 valid=5s ipv6=off;

    location /api/status/ {
        set $read_api http://read-api:8000;
        rewrite ^/api/status/(.*)$ /$1 break;
        proxy_pass $read_api;
        proxy_set_header Host $host;
    }

    location /api/simulator/ {
        set $simulator_api http://simulator-api:8001;
        rewrite ^/api/simulator/(.*)$ /$1 break;
        proxy_pass $simulator_api;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
